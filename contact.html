<!DOCTYPE html>
<html lang="sq">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">
    
    <title>Campus Hub</title>
</head>
<body>
<header>
    <h1>Campus Hub</h1>
    <p>Discover events, clubs and activities on campus.</p>
    <nav>
        <a href="home.html">Home</a>
        <a href="events.html">Events</a>
        <a href="clubs.html">Clubs</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section>
        <h2>Contact Us</h2>
        <p>Have any questions?<br>Send us a message.</p>
        
    <form>
        <div>
            <label for="name">Full name: </label>
            <input type="text" name="names" id="name" required minLength="3">
        </div>

         <div>
            <label for="email">Email: </label>
            <input type="email" name="email" id="email" required >
        </div>

         <div>
            <label for="subject">Subject: </label>
            <select name="subject" id="subject">
                <option value="">Select a subject</option>
                <option value="events">Events</option>
                <option value="clubs">Clubs</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <label for="message"></label>
            <textrea id="message" name="message" required></textrea>
        </div>
        <button type="submit">Submit</button>

    </form>

    </section>
</main>

</body>
</html>
